name: Publish to PyPI

# Fires when you publish a GitHub Release (Releases → Draft a new release).
# Tag the release `v1.0.0`, `v1.0.1`, etc — must match bastion-prompt-protection/version.py.
#
# Authentication: PyPI Trusted Publishing (OIDC). No API token is stored.
# One-time setup on PyPI: https://pypi.org/manage/account/publishing/
#   - PyPI Project Name: bastion-prompt-protection
#   - Owner: <your GitHub user/org>
#   - Repository: bastion-prompt-protection
#   - Workflow name: publish.yml
#   - Environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: verify tag matches package version
        # Read version.py in an isolated namespace — `from bastion_prompt_protection.version
        # import ...` would trigger bastion-prompt-protection/__init__.py and pull in numpy
        # before we've installed any deps. version.py is a single
        # __version__ = "..." line with no imports of its own, so exec'ing
        # it into an empty dict is safe and dependency-free.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="v$(python -c 'g={}; exec(open("bastion-prompt-protection/version.py").read(), g); print(g["__version__"])')"
          echo "tag=$TAG pkg=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: build
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bastion-prompt-protection
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1

name: Build and publish Docker images

# Manually-triggered Docker image build & push. Decoupled from the PyPI
# release workflow (`publish.yml`) because:
#   - The Dockerfile pip-installs bastion-prompt-protection from PyPI, so
#     it must run AFTER `publish.yml` has succeeded, not in parallel.
#   - Docker base-image refreshes (CUDA / Python security patches) often
#     need to ship without cutting a new PyPI release.
#   - Build failures on one shouldn't block the other.
#
# Typical workflow:
#   1. Tag + draft a GitHub Release for vX.Y.Z → `publish.yml` ships to PyPI.
#   2. Verify the PyPI release works (pip install in a fresh venv).
#   3. Go to Actions → "Build and publish Docker images" → "Run workflow"
#      → pick branch `main`, optionally type a version tag, click Run.
#
# Tags applied:
#   - `<version>` and `latest` for the CPU image
#   - `<version>-gpu` and `latest-gpu` for the GPU image
# Where <version> defaults to the package version in
# bastion_prompt_protection/version.py if the workflow input is left blank.
#
# Architectures:
#   - CPU image: linux/amd64 + linux/arm64 (multi-arch manifest, so Apple
#     Silicon Macs and AWS Graviton pull a native arm64 image without
#     emulation). The arm64 build runs under qemu on the GitHub-hosted
#     amd64 runner — ~2× slower than the native amd64 build.
#   - GPU image: linux/amd64 only. CUDA's arm64 story is limited to
#     Jetson / Grace Hopper-style devices that aren't the target audience
#     for the GPU image, and the CUDA base layer adds ~30 minutes when
#     emulated.
#
# One-time setup:
#   1. GHCR — works automatically; uses GITHUB_TOKEN.
#   2. Docker Hub — create an access token at
#      https://hub.docker.com/settings/security then add two repository
#      secrets:
#         DOCKERHUB_USERNAME — your Docker Hub username
#         DOCKERHUB_TOKEN    — the access token
#      (Skip these if you only want to publish to GHCR; the dockerhub
#      push step will warn-and-skip on missing creds.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Image tag to publish (e.g. `1.0.0`). Leave blank to read from
          bastion_prompt_protection/version.py.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: docker/Dockerfile.cpu
            suffix: ""
            platforms: "linux/amd64,linux/arm64"
          - flavor: gpu
            dockerfile: docker/Dockerfile.gpu
            suffix: "-gpu"
            platforms: "linux/amd64"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: tag
        run: |
          INPUT="${{ inputs.version }}"
          if [ -z "$INPUT" ]; then
            VERSION=$(python -c 'g={}; exec(open("bastion_prompt_protection/version.py").read(), g); print(g["__version__"])')
          else
            VERSION="$INPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building images tagged: $VERSION (+ latest) for platforms: ${{ matrix.platforms }}"

      # Required for cross-arch builds — installs binfmt_misc handlers so
      # the amd64 runner can build linux/arm64 layers under qemu emulation.
      # No-op for the GPU build (amd64-only) but cheap enough to leave in.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── GHCR ────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Docker Hub (skip silently if creds missing) ─────────────────
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bastion-prompt-protection:latest${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/bastion-prompt-protection:${{ steps.tag.outputs.version }}${{ matrix.suffix }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/bastion-prompt-protection:latest{1}', secrets.DOCKERHUB_USERNAME, matrix.suffix) || '' }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/bastion-prompt-protection:{1}{2}', secrets.DOCKERHUB_USERNAME, steps.tag.outputs.version, matrix.suffix) || '' }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=${{ matrix.flavor }},mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  # Push docker/README.md to Docker Hub as the project's full description.
  # Runs once after both flavors built successfully. Skipped silently if
  # Docker Hub creds aren't configured (GHCR-only deployments).
  #
  # Note on the conditional shape: GitHub Actions forbids `secrets.*` in
  # job-level `if:` expressions, so we can't gate the whole job on a
  # secret. Instead the job always runs but the upload step is gated on
  # a step output that reads DOCKERHUB_USERNAME via `env:` — step-level
  # contexts allow secrets and produce the same effect.
  update-dockerhub-description:
    name: update Docker Hub description
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured — skipping description push."
            echo "(Set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets to enable.)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push README to Docker Hub
        if: steps.check.outputs.configured == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/bastion-prompt-protection
          short-description: "Self-hosted prompt-injection and jailbreak detector for LLM apps. ~5 ms CPU inference. Beats every open public baseline tested."
          readme-filepath: docker/README.md

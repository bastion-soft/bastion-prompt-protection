name: Build and publish Docker images

# Manually-triggered Docker image build & push. Decoupled from the PyPI
# release workflow (`publish.yml`) because:
#   - The Dockerfile pip-installs bastion-prompt-protection from PyPI, so
#     it must run AFTER `publish.yml` has succeeded, not in parallel.
#   - Docker base-image refreshes (CUDA / Python security patches) often
#     need to ship without cutting a new PyPI release.
#   - Build failures on one shouldn't block the other.
#
# Typical workflow:
#   1. Tag + draft a GitHub Release for vX.Y.Z → `publish.yml` ships to PyPI.
#   2. Verify the PyPI release works (pip install in a fresh venv).
#   3. Go to Actions → "Build and publish Docker images" → "Run workflow"
#      → pick branch `main`, optionally type a version tag, click Run.
#
# Tags applied:
#   - `<version>` and `latest` for the CPU image
#   - `<version>-gpu` and `latest-gpu` for the GPU image
# Where <version> defaults to the package version in
# bastion_prompt_protection/version.py if the workflow input is left blank.
#
# One-time setup:
#   1. GHCR — works automatically; uses GITHUB_TOKEN.
#   2. Docker Hub — create an access token at
#      https://hub.docker.com/settings/security then add two repository
#      secrets:
#         DOCKERHUB_USERNAME — your Docker Hub username
#         DOCKERHUB_TOKEN    — the access token
#      (Skip these if you only want to publish to GHCR; the dockerhub
#      push step will warn-and-skip on missing creds.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Image tag to publish (e.g. `1.0.0`). Leave blank to read from
          bastion_prompt_protection/version.py.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: docker/Dockerfile.cpu
            suffix: ""
          - flavor: gpu
            dockerfile: docker/Dockerfile.gpu
            suffix: "-gpu"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: tag
        run: |
          INPUT="${{ inputs.version }}"
          if [ -z "$INPUT" ]; then
            VERSION=$(python -c 'g={}; exec(open("bastion_prompt_protection/version.py").read(), g); print(g["__version__"])')
          else
            VERSION="$INPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building images tagged: $VERSION (+ latest)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── GHCR ────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Docker Hub (skip silently if creds missing) ─────────────────
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bastion-server:latest${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/bastion-server:${{ steps.tag.outputs.version }}${{ matrix.suffix }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/bastion-server:latest{1}', secrets.DOCKERHUB_USERNAME, matrix.suffix) || '' }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/bastion-server:{1}{2}', secrets.DOCKERHUB_USERNAME, steps.tag.outputs.version, matrix.suffix) || '' }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=${{ matrix.flavor }},mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

name: Build and publish Docker images

# Fires on every GitHub Release publication. Builds CPU + GPU images,
# tags them with `latest` and the release version, pushes to both
# GitHub Container Registry (GHCR) and Docker Hub.
#
# One-time setup:
#   1. GHCR — works automatically; the workflow uses GITHUB_TOKEN.
#   2. Docker Hub — create an access token at https://hub.docker.com/settings/security
#      then add two repository secrets:
#         DOCKERHUB_USERNAME — your Docker Hub username
#         DOCKERHUB_TOKEN    — the access token
#      (Skip these if you only want to publish to GHCR; the dockerhub
#      push step will warn-and-skip on missing creds.)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            dockerfile: docker/Dockerfile.cpu
            suffix: ""
          - flavor: gpu
            dockerfile: docker/Dockerfile.gpu
            suffix: "-gpu"

    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        id: tag
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            REF="latest"
          fi
          echo "version=$REF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── GHCR ────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Docker Hub (skip silently if creds missing) ─────────────────
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bastion-server:latest${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/bastion-server:${{ steps.tag.outputs.version }}${{ matrix.suffix }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/bastion-server:latest{1}', secrets.DOCKERHUB_USERNAME, matrix.suffix) || '' }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/bastion-server:{1}{2}', secrets.DOCKERHUB_USERNAME, steps.tag.outputs.version, matrix.suffix) || '' }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=${{ matrix.flavor }},mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bastion-prompt-protection"
dynamic = ["version"]
description = "Local prompt injection and jailbreak detection for LLM applications"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Bastion Soft" },
]
keywords = [
    "prompt-injection",
    "jailbreak",
    "llm-security",
    "ai-safety",
    "guardrails",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
training = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "evaluate>=0.4",
    "scikit-learn>=1.3",
    "accelerate>=0.27",
    "optimum[onnxruntime]>=1.17",
    "openai>=1.50",  # optional: LLM-augmented training data generation
]
eval = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "datasets>=2.18",
    "tabulate>=0.9",
    "torch>=2.1",
    "transformers>=4.40",
    "tqdm>=4.66",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/bastionsoft/bastion-prompt-protection"
Issues = "https://github.com/bastionsoft/bastion-prompt-protection/issues"

[tool.hatch.version]
path = "bastion_prompt_protection/version.py"

[tool.hatch.build.targets.wheel]
packages = ["bastion_prompt_protection"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# N806/N812 conflict with established ML conventions: `F` for
# torch.nn.functional, `T` for temperature, `K` for keys, etc.
"training/losses.py" = ["N806", "N812"]
"training/distillation.py" = ["N806", "N812"]
"training/trainer.py" = ["N806", "N812"]
"notebooks/*.py" = ["N806", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
